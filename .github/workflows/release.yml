name: Release

on:
  push:
    branches:
      - main
    paths:
      - "packages/**"
      - ".changeset/**"
      - "package.json"
      - "bun.lock"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
        env:
          # repo 级 full-access NPM_TOKEN：bypass-2FA 的 GITHUB_TOKEN 派生凭据
          # 无法在 @ventostack scope 下创建新包名（oauth/ai-trace 首版发布 E404），
          # 配置了 NPM_TOKEN 后优先使用它；未配置时回退 GITHUB_TOKEN 行为不变。
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create version PR or publish packages
        id: changesets
        uses: changesets/action@v1
        with:
          version: bun run version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build packages
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: bun run build

      # changesets publish 固定走 npm publish，npm 不会重写 workspace:*，
      # 发布前统一重写为实际版本，保证 npm 产物可被下游安装。
      - name: Rewrite workspace dependencies for npm
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: bun run scripts/prepare-publish.ts

      - name: Publish packages
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: bunx changeset publish
        env:
          NPM_CONFIG_PROVENANCE: true
