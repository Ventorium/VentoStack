name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Require a changeset for package changes
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          changed_files="$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)"
          if printf '%s\n' "$changed_files" | grep -q '^packages/'; then
            if ! printf '%s\n' "$changed_files" | grep -q '^\.changeset/.*\.md$'; then
              echo "Package changes under packages/ must include a changeset file in .changeset/."
              exit 1
            fi
          fi

      - name: Lint
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            diff_range="origin/${{ github.base_ref }}...HEAD"
          else
            diff_range="${{ github.event.before }}..HEAD"
          fi
          mapfile -t lint_files < <(
            git diff --name-only --diff-filter=ACMR "$diff_range" -- \
              '*.js' '*.jsx' '*.ts' '*.tsx' '*.json' '*.jsonc' '*.css'
          )
          if (( ${#lint_files[@]} > 0 )); then
            bunx biome ci "${lint_files[@]}"
          else
            echo "No Biome-supported files changed; skipping lint."
          fi

      - name: Build Packages
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build Admin Web
        run: bun run --cwd apps/admin/web build
